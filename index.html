<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Foundation</title>
<meta name="description" content="Infrastructure for sovereign individuals, from identity and money to services and community.">
<meta name="theme-color" content="#0a0908">
<meta property="og:type" content="website">
<meta property="og:url" content="https://signfoundation.org/">
<meta property="og:title" content="Sign Foundation">
<meta property="og:description" content="We are sovereign individuals. We empower ourselves, and we unite on our own terms.">
<meta property="og:image" content="https://signfoundation.org/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="We are sovereign individuals. Sign Foundation.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0908;
    --ink: #ede8e1;
    --muted: #7d766e;
    --accent: #e56616;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: clamp(24px, 5vw, 56px);
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent); color: var(--bg); }

  .label {
    font-size: 12px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer.label { font-size: 11px; color: #6b655e; }

  .glow {
    position: fixed;
    left: 100%; top: 0;
    width: 140vmax; height: 140vmax;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(229,102,22,.3) 0%, rgba(229,102,22,.09) 25%, transparent 55%);
    pointer-events: none;
    z-index: -1;
    animation: breathe 10s ease-in-out infinite;
  }

  @keyframes breathe { 50% { opacity: .6; } }

  @media (max-width: 720px) {
    br.wide { display: none; }
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 52rem;
    padding: 64px 0;
  }

  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(44px, 7vw, 96px);
    line-height: 1;
    letter-spacing: -.02em;
  }

  h1 em { color: var(--accent); }

  .sub {
    margin-top: 24px;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: clamp(22px, 2.4vw, 30px);
    line-height: 1.3;
    color: var(--muted);
  }

  .mission {
    margin-top: 48px;
    padding-top: 28px;
    max-width: 30em;
    background: linear-gradient(#4a4540, #4a4540) top left / 40px 1px no-repeat;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: clamp(18px, 1.6vw, 21px);
    line-height: 1.5;
    color: var(--muted);
  }

  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 12px 24px;
  }

  .contact {
    color: var(--muted);
    text-decoration: none;
    transition: color .3s;
  }

  .contact:hover, .contact:focus-visible { color: var(--accent); }

  main > * { animation: in 1.6s cubic-bezier(.2,.8,.2,1) both; }
  main > :nth-child(2) { animation-delay: .4s; }
  main > :nth-child(3) { animation-delay: .8s; }

  .mission .name { color: var(--ink); }

  @keyframes in { from { opacity: 0; transform: translateY(8px); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <h1>We are <em>sovereign</em> individuals.</h1>
    <p class="sub">We empower ourselves, and we unite on our own terms.</p>
    <p class="mission">The mission of <span class="name">Sign Foundation</span> is both ideological and technological:<br class="wide"> to build infrastructure for sovereign individuals, from identity and money to services and community.</p>
  </main>

  <footer class="label">
    <span>&copy; 2026 Sign Foundation</span>
    <a class="contact" href="mailto:info@signfoundation.org">Contact Us</a>
  </footer>
</body>
</html>
